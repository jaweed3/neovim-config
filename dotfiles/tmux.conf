set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"
set -ga terminal-overrides '*:Ss=\E[%p1%d q:Se=\E[ q'
set -sg escape-time 0
set -g focus-events on
set -g mouse on
set -g history-limit 10000
set -g set-clipboard on

set -g mode-keys vi
set -g status-keys vi

set -g base-index 1
set -g pane-base-index 1
set -w -g pane-base-index 1

set -g status-interval 5
set -g status-position top
set -g status-left-length 30
set -g status-right-length 50

set -g status-left "#[fg=#1e1e2e,bg=#89b4fa,bold]  #S #[fg=#89b4fa,bg=#1e1e2e,nobold]"
set -g status-right "#[fg=#a6e3a1,bg=#1e1e2e] %H:%M  #[fg=#89b4fa,bg=#1e1e2e] #(date '+%d/%m')  "
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"
set -g window-status-current-format "#[fg=#1e1e2e,bg=#89b4fa,bold] #I  #W "
set -g window-status-format "#[fg=#cdd6f4,bg=#313244] #I  #W "
set -g window-status-separator " "

unbind C-b
set -g prefix C-space
bind C-space send-prefix
bind r source-file ~/.tmux.conf \; display "Reloaded!"

bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind H resize-pane -L 5
bind J resize-pane -D 5
bind K resize-pane -U 5
bind L resize-pane -R 5

bind z resize-pane -Z

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @vim-tmux-navigator-vim-key 'M-h M-j M-k M-l'

run '~/.tmux/plugins/tpm/tpm'
